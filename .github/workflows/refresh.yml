name: Refresh projects

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths: ["projects.config.json", "scripts/build.py", "scripts/screenshots.mjs"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build project data
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture covers for new live sites
        run: |
          npm i --no-save puppeteer-core
          node scripts/screenshots.mjs --missing
          if [ -n "$(git status --porcelain assets/shots)" ]; then python3 scripts/build.py; fi
        env:
          CHROME: /usr/bin/google-chrome
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git add -A data assets/shots
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh project data"
            git push
          fi
